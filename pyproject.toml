[project]
name = "blazon-parse"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jannika Lossner" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118.0",
    "inflect>=7.5.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "requests>=2.34.2",
    "uvicorn>=0.38.0",
]

[project.scripts]
blazon-parse = "blazon_parse.main:main"
blazon-parse-web = "blazon_parse.web:run"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
]
