<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blazon Parse{% endblock %}</title>
  <link rel="stylesheet" href="/static/daisyui.css">
  <link rel="stylesheet" href="/static/flatpickr.min.css">
  <link rel="stylesheet" href="/static/flatpickr-monthSelect.css">
  <script src="/static/tailwind.js"></script>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/flatpickr.min.js"></script>
  <script src="/static/flatpickr-monthSelect.js"></script>
</head>
<body class="min-h-screen bg-base-200">
  <div class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <a href="/" class="btn btn-ghost text-xl">Blazon Parse</a>
    </div>
    <div class="flex-none">
      <a href="/settings" class="btn btn-ghost">Settings</a>
    </div>
  </div>
  <main class="container mx-auto max-w-3xl p-4 flex flex-col gap-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
